<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>G検定ジム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:20px;line-height:1.5;-webkit-user-select:none;user-select:none}
.scr{display:none;min-height:100vh;padding:16px 14px 120px}
.scr.on{display:block}
h1{font-size:28px;margin:10px 0 12px}
h2{font-size:17px;color:#aaa;margin:18px 0 6px}
.cd{background:#311;color:#fc6;padding:10px;border-radius:12px;text-align:center;font-weight:bold}
.sub{color:#aaa;font-size:15px;margin-bottom:6px}
.big{display:block;width:100%;padding:20px;margin:10px 0;font-size:24px;font-weight:bold;border:none;border-radius:16px;color:#fff;background:#333;text-align:left}
.big small{display:block;font-size:15px;font-weight:normal;opacity:.85}
.bike{background:#0a5}.run{background:#06c}.rev{background:#c60}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:72px;padding:14px 8px;font-size:17px;border:2px solid #444;border-radius:12px;background:#111;color:#fff;text-align:center}
.chip.sel{border-color:#ff0;color:#ff0}
.chip.w{display:block;width:100%;text-align:left;margin:6px 0}
.danger{border-color:#a33;color:#f88}
.bar{display:flex;justify-content:space-between;align-items:center;color:#aaa;font-size:16px;gap:8px}
.x{background:#333;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:16px}
.tag{color:#6cf;font-size:15px;margin:10px 0 4px}
.q{font-size:22px;font-weight:bold;margin:4px 0 14px;line-height:1.55}
.opt{display:flex;align-items:center;width:100%;min-height:74px;padding:12px;margin:8px 0;font-size:19px;text-align:left;border:2px solid #333;border-radius:14px;background:#151515;color:#fff}
.opt .no{flex:0 0 40px;height:40px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;margin-right:12px;font-weight:bold}
.good{border-color:#0c6!important;background:#063!important}
.bad{border-color:#e33!important;background:#511!important}
.dim{opacity:.35}
#fb{display:none;background:#111;border-radius:14px;padding:14px;margin-top:8px}
#res{font-size:26px;font-weight:bold;margin-bottom:6px}
.okc{color:#0f8}.ngc{color:#f55}
#ex{font-size:18px;color:#ddd}
#next{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:80px;font-size:28px;font-weight:bold;border:none;border-radius:18px;background:#ff0;color:#000}
#rst{font-size:26px;color:#ff0;font-weight:bold;margin:10px 0;min-height:40px}
.ro{padding:8px 0;font-size:19px;border-bottom:1px solid #222}
.ro.good{color:#0f8;font-weight:bold;background:none!important}
#rans{color:#ccc;margin:10px 0;font-size:17px}
#rgrade{display:none;gap:8px;margin:8px 0}
#rgrade.on{display:flex}
#rgrade.done .gb{opacity:.3}
.gb{flex:1;height:90px;font-size:22px;border:none;border-radius:16px;color:#fff;font-weight:bold}
.gok{background:#063}.gng{background:#611}
.rbtm{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#000}
.rbtm button{flex:1;height:80px;font-size:22px;border:none;border-radius:16px;background:#333;color:#fff;font-weight:bold}
#rpause{flex:2;background:#06c}
.st{margin:14px 0}.stn{font-size:17px}
.sbar{height:14px;background:#222;border-radius:7px;overflow:hidden;margin:4px 0}
.sbar i{display:block;height:100%}
.sts{font-size:14px;color:#aaa}
.big2{font-size:72px;font-weight:bold;text-align:center;color:#ff0}
.big2 small{font-size:30px}
#done p{text-align:center;color:#ccc;margin:6px 0}
.tip{background:#112;color:#9cf;padding:10px;border-radius:10px;font-size:15px;margin:10px 0}
</style>
</head>
<body>
 
<div id="home" class="scr on">
<div class="cd" id="cd"></div>
<h1>G検定ジム 🏋️</h1>
<div class="sub" id="hsum"></div>
<h2>今日の時間</h2>
<div class="row" id="mins"></div>
<button class="big bike" onclick="start('bike')">🚴 バイクモード<small>大きなボタンで4択</small></button>
<button class="big run" onclick="start('run')">🏃 ランモード<small>イヤホンで聞き流し・操作不要</small></button>
<button class="big rev" onclick="start('rev')">🔁 復習モード<small id="revn"></small></button>
<div class="row"><button class="chip" onclick="go('stats')">📊 成績</button><button class="chip" onclick="go('set')">⚙️ 設定</button></div>
</div>
 
<div id="quiz" class="scr">
<div class="bar"><span id="qinfo"></span><span id="qtime"></span><button class="x" onclick="finish()">■ 終了</button></div>
<div class="tag" id="qtag"></div>
<div class="q" id="qtext"></div>
<div id="opts"></div>
<div id="fb"><div id="res"></div><div id="ex"></div></div>
<button id="next" onclick="showQ()">次へ ▶</button>
</div>
 
<div id="run" class="scr">
<div class="bar"><span id="rinfo"></span><span id="rtime"></span></div>
<div class="row" style="margin-top:8px"><button class="chip" onclick="spd(-0.25)">🐢 遅く</button><div class="chip" id="rspd"></div><button class="chip" onclick="spd(0.25)">🐇 速く</button></div>
<div id="rst"></div>
<div class="tag" id="rtag"></div>
<div class="q" id="rq"></div>
<div id="ropts"></div>
<div id="rans"></div>
<div id="rgrade"><button class="gb gok" onclick="grade(1)">⭕ 正解した</button><button class="gb gng" onclick="grade(0)">❌ 間違えた</button></div>
<div class="rbtm"><button id="rpause" onclick="togglePause()">⏸ 一時停止</button><button onclick="finish()">■ 終了</button></div>
</div>
 
<div id="done" class="scr"><h1>おつかれさま！💪</h1><div id="dsum"></div><button class="big" onclick="go('home')">ホームへ</button></div>
 
<div id="stats" class="scr"><h1>📊 成績</h1><div id="stbody"></div><button class="big" onclick="go('home')">戻る</button></div>
 
<div id="set" class="scr">
<h1>⚙️ 設定</h1>
<h2>出題する分野</h2><div id="chs"></div>
<h2>難易度</h2><div class="row" id="lvs"></div>
<h2>読み上げ速度（ラン）</h2><div class="row" id="rates"></div>
<h2>考える時間（ラン）</h2><div class="row" id="thinks"></div>
<button class="chip w" onclick="unlockSpeak('音声テストです。ランニング中は、この声で問題を読み上げます。')">🔊 音声テスト</button>
<h2>問題の追加・編集（Excel）</h2>
<div class="sub" id="xinfo"></div>
<button class="chip w" onclick="exportCSV()">⬇ 全問題をCSVで書き出す</button>
<label class="chip w">⬆ CSVを読み込む（問題を追加）<input type="file" accept=".csv,text/csv" id="csvin" hidden></label>
<button class="chip w" onclick="clearExtra()">追加した問題を削除</button>
<button class="chip w danger" onclick="resetStat()">成績をリセット</button>
<button class="big" onclick="go('home')">戻る</button>
</div>
 
<script>
const EXAM=new Date('2027-01-16T13:00:00+09:00');
const CH=["","人工知能とは・動向","機械学習","ディープラーニングの概要","ディープラーニングの要素技術","応用・生成AI","社会実装・数理統計","法律・倫理・ガバナンス"];
// [分野, 難易度1-3, 問題, 正解, 誤答1, 誤答2, 誤答3, 解説, 計算=1]
const BASE=[
[1,1,"1956年のダートマス会議で「人工知能（Artificial Intelligence）」という言葉を初めて使った人物は？","ジョン・マッカーシー","アラン・チューリング","ジェフリー・ヒントン","ヤン・ルカン","ダートマス会議はマッカーシーらが提案した研究会で、ここで初めて人工知能という言葉が使われた。"],
[1,1,"第1次AIブーム（1950年代後半〜1960年代）の中心となった技術は？","探索・推論","エキスパートシステム","ディープラーニング","統計的機械翻訳","第1次は探索・推論、第2次は知識（エキスパートシステム）、第3次は機械学習・ディープラーニング。"],
[1,1,"第2次AIブーム（1980年代）の中心となった技術は？","エキスパートシステム","探索木による迷路の解法","ディープラーニング","強化学習","専門家の知識をルールとして入れるエキスパートシステムが流行した。"],
[1,2,"第1次AIブームが終わった主な理由は？","簡単なトイ・プロブレムしか解けず、現実の複雑な問題に対応できなかった","計算機が一台も存在しなかった","インターネットが普及していなかった","著作権法で研究が禁止された","迷路やパズルのようなルールが決まった問題は解けたが、現実の問題は解けないとわかり冬の時代に入った。"],
[1,2,"第2次AIブームの衰退につながった「知識獲得のボトルネック」とは？","専門家の知識をルールとして書き出し、維持するのが非常に大変だという問題","GPUの性能が不足していた問題","学習データにラベルを付けられない問題","AIが自分で知識を獲得しすぎる問題","人間の暗黙知や常識をすべてルール化するのは難しく、エキスパートシステムの限界となった。"],
[1,1,"チューリングテストで判定しようとしたものは？","機械が人間と区別できないような会話をできるか","機械が画像を正しく分類できるか","機械の計算速度","機械が自分で学習できるか","別室の相手が人間か機械か判別できなければ、その機械には知能があるとみなすテスト。"],
[1,2,"ジョン・サールが「中国語の部屋」で主張したことは？","記号を規則どおりに操作できても、意味を理解しているとは限らない","中国語は機械翻訳が最も難しい言語である","チューリングテストに合格すれば知能があると言える","AIは身体を持たなければ学習できない","チューリングテストへの批判。サールは強いAIと弱いAIという区別も提唱した。"],
[1,2,"記号（言葉）と、それが指す実世界の意味をコンピュータが結びつけられない問題を何という？","シンボルグラウンディング問題","フレーム問題","次元の呪い","勾配消失問題","ハルナッドが提唱。シマウマをシマとウマという記号で知っていても、実物と結びつかないという例が有名。"],
[1,2,"「今しようとしていることに関係ある事柄だけを選び出すことが難しい」というAIの問題は？","フレーム問題","シンボルグラウンディング問題","知識獲得のボトルネック","モラベックのパラドックス","マッカーシーとヘイズが提唱。爆弾を運ぶロボットの例が有名。"],
[1,2,"1960年代にワイゼンバウムが開発し、精神療法士のように応答した対話プログラムは？","ELIZA","MYCIN","DENDRAL","SHRDLU","パターンに合わせて返答するだけだったが、人が本気で対話してしまうイライザ効果で知られる。"],
[1,2,"血液の細菌感染の診断と、抗生物質の推奨を行ったエキスパートシステムは？","MYCIN","DENDRAL","ELIZA","Watson","MYCINはスタンフォード大学で開発された。DENDRALは有機化合物の構造を推定するシステム。"],
[1,1,"レイ・カーツワイルが、技術的特異点（シンギュラリティ）が来ると予測した年は？","2045年","2020年","2100年","2030年","カーツワイルは2045年にシンギュラリティが到来すると予測した。"],
[1,2,"第3次AIブームのきっかけとされる2012年の出来事は？","画像認識コンテストILSVRCで、ディープラーニングを使ったチームが圧勝した","AlphaGoが囲碁のトップ棋士に勝った","ChatGPTが公開された","ダートマス会議が開かれた","トロント大学ヒントンらのAlexNetが、従来手法を大きく上回る成績で優勝した。"],
[1,2,"ゲーム木の探索で、自分の手番では評価値が最大、相手の手番では最小になる手を選ぶと仮定する方法は？","Mini-Max法","モンテカルロ法","幅優先探索","ε-greedy法","Mini-Max法の無駄な探索を省く方法がαβ法。"],
[1,3,"幅優先探索と深さ優先探索の説明として正しいものは？","幅優先探索は最短の解を見つけられるが、メモリを多く使う","深さ優先探索は必ず最短の解を見つける","幅優先探索はメモリをほとんど使わない","両者は探索の順番以外まったく同じ性能である","深さ優先探索はメモリが少なくて済むが、最短の解とは限らない。"],
[1,3,"オントロジーにおける is-a 関係と part-of 関係の説明として正しいものは？","is-a関係では推移律が成り立つが、part-of関係では常に成り立つとは限らない","part-of関係では必ず推移律が成り立つ","is-a関係は全体と部分を表す","両方とも推移律は成り立たない","is-aは上位と下位の概念の関係で、人間は哺乳類、など。part-ofは全体と部分の関係。"],
[1,2,"2011年にクイズ番組Jeopardy!で人間のチャンピオンに勝ったIBMのシステムは？","Watson","Deep Blue","AlphaGo","Siri","Watsonは質問応答システム。Deep Blueは1997年にチェスの世界チャンピオンに勝ったIBMのシステム。"],
 
[2,1,"正解ラベル付きのデータを使って、入力から出力を予測するモデルを学習する方法は？","教師あり学習","教師なし学習","強化学習","自己教師あり学習","教師あり学習は、数値を予測する回帰と、カテゴリを当てる分類に分かれる。"],
[2,1,"教師あり学習のうち、売上や気温など連続した数値を予測するタスクは？","回帰","分類","クラスタリング","次元削減","カテゴリを当てるのが分類、数値を当てるのが回帰。"],
[2,3,"ロジスティック回帰の説明として正しいものは？","名前に回帰とつくが、主に分類に使われる手法である","連続値の予測専用の手法である","教師なし学習の手法である","決定木を多数組み合わせる手法である","シグモイド関数で0から1の確率を出力し、2クラス分類などに使う。ひっかけに注意。"],
[2,1,"データをあらかじめ決めたk個のグループに分ける、教師なし学習の手法は？","k-means法","k近傍法","ロジスティック回帰","サポートベクターマシン","k近傍法は教師ありの分類手法なので混同に注意。"],
[2,2,"相関のある多数の変数を、少数の無相関な変数にまとめる次元削減の手法は？","主成分分析（PCA）","ランダムフォレスト","Q学習","k近傍法","PCAは教師なし学習の代表的な次元削減手法。"],
[2,1,"エージェントが環境の中で行動し、得られる報酬の合計を最大にするよう学習する方法は？","強化学習","教師あり学習","教師なし学習","転移学習","囲碁やロボット制御などで使われる。"],
[2,2,"ランダムフォレストの説明として正しいものは？","データや特徴量をランダムに選んで多数の決定木を作り、多数決などでまとめる","1本の深い決定木だけを使う","弱いモデルを順番に学習させ、前の誤りを重点的に直す","ニューラルネットワークの一種である","並列に学習して結果をまとめるのがバギングで、ランダムフォレストはその代表例。"],
[2,2,"弱いモデルを順番に作り、前のモデルが間違えたデータを重視して学習していくアンサンブル手法は？","ブースティング","バギング","ドロップアウト","交差検証","勾配ブースティングなどが代表。バギングは並列、ブースティングは逐次と覚える。"],
[2,2,"サポートベクターマシン（SVM）の基本的な考え方は？","クラス間のマージン（境界との距離）を最大化する","誤差を出力層から入力層へ逆伝播させる","データをk個のクラスタに分ける","報酬を最大化する行動を学ぶ","カーネル法を使うと、非線形な分類もできる。"],
[2,1,"訓練データにはよく当てはまるが、未知のデータでは性能が低い状態を何という？","過学習","未学習","汎化","正則化","対策には、正則化、データを増やす、モデルを単純にするなどがある。"],
[2,3,"L1正則化（Lasso）の特徴として正しいものは？","一部のパラメータを0にしやすく、不要な特徴量を選別する効果がある","すべてのパラメータを均等に大きくする","過学習を促進する","パラメータを0にすることは決してない","L2正則化（Ridge）はパラメータ全体を小さく滑らかにする。"],
[2,2,"データをk個に分け、1つを評価用、残りを学習用にする組み合わせを順に替えて評価する方法は？","k-分割交差検証","ホールドアウト法","ブートストラップ法","グリッドサーチ","ホールドアウト法は、訓練用とテスト用に1回だけ分ける方法。"],
[2,2,"適合率（Precision）の説明として正しいものは？","陽性と予測したもののうち、実際に陽性だった割合","実際に陽性のもののうち、陽性と予測できた割合","全データのうち、予測が当たった割合","陰性と予測したもののうち、実際に陰性だった割合","実際の陽性のうち当てられた割合は、再現率（Recall）。"],
[2,3,"TP=40、FP=10、FN=20、TN=30 のとき、適合率（Precision）は？","0.8","0.67","0.7","0.4","適合率＝TP÷(TP＋FP)＝40÷50＝0.8。再現率は40÷60≒0.67、正解率は70÷100＝0.7。",1],
[2,2,"がん検診のように、陽性の見逃しをできるだけ減らしたい場合に重視すべき指標は？","再現率（Recall）","適合率（Precision）","正解率（Accuracy）","学習率","再現率は、実際の陽性をどれだけ拾えたか。見逃し（FN）を減らすときに重視する。"],
[2,2,"F値（F1スコア）とは？","適合率と再現率の調和平均","正解率と再現率の算術平均","適合率と再現率の積","AUCの2倍","適合率と再現率はトレードオフなので、バランスを見るためにF値を使う。"],
[2,3,"陽性99%、陰性1%の不均衡データで、すべてを陽性と予測するモデルの評価として正しいものは？","正解率は99%になるが、陰性をまったく見つけられず役に立たない","正解率が99%なので優秀なモデルである","正解率は1%になる","陽性の再現率は0になる","不均衡データでは、正解率だけで判断せず、他の指標もあわせて確認する。"],

/* ---------- 共通 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ST=LS.get('gk_stat',{q:{},days:{}});
let SET=Object.assign({min:15,rate:1.0,think:5,ch:[1,2,3,4,5,6,7],lv:[1,2,3]},LS.get('gk_set',{}));
const saveST=()=>LS.set('gk_stat',ST),saveSET=()=>LS.set('gk_set',SET);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hid=s=>{let x=5381;for(const c of s)x=((x<<5)+x+c.codePointAt(0))|0;return 'q'+(x>>>0).toString(36)};
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
 
/* ---------- 問題データ（内蔵＋自動読み込み＋手動追加） ---------- */
let ALL=[],CNT={base:0,auto:0,extra:0},AUTOMSG='';
const mk=(c,l,q,a,w1,w2,w3,ex,calc,src)=>({id:hid(q),ch:+c,lv:+l,q,a,w:[w1,w2,w3],ex:ex||'',calc:!!+calc,src});
function parseCSV(t){
t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],f='',q=false;
for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
else if(c=='"')q=true;
else if(c==','){r.push(f);f=''}
else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}
else f+=c}
if(f!==''||r.length){r.push(f);rows.push(r)}
return rows}
function csvQs(t,src){
return parseCSV(t).filter(r=>r.length>=7&&/^[1-7]$/.test(r[0].trim())&&r[2].trim()&&r[3].trim())
.map(r=>{const l=Math.min(3,Math.max(1,parseInt(r[1])||2));
return mk(r[0].trim(),l,r[2].trim(),r[3].trim(),r[4].trim(),r[5].trim(),r[6].trim(),(r[7]||'').trim(),(r[8]||'0').trim()=='1'?1:0,src)})}
function rebuild(){
const seen=new Set();ALL=[];CNT={base:0,auto:0,extra:0};
const add=q=>{if(seen.has(q.id))return;seen.add(q.id);ALL.push(q);CNT[q.src]++};
BASE.forEach(b=>add(mk(...b.slice(0,8),b[8]||0,'base')));
const au=LS.get('gk_auto',{});Object.keys(au).sort((a,b)=>a-b).forEach(k=>csvQs(au[k],'auto').forEach(add));
LS.get('gk_extra',[]).forEach(q=>add(Object.assign(q,{src:'extra'})));
}
/* 起動時に q2.csv, q3.csv … を順に読み込む（番号が途切れたら終了） */
async function autoLoad(){
if(!/^https?:/.test(location.protocol)){AUTOMSG='自動読み込み：GitHub Pagesで開いたときのみ動作';return}
const got={};let n=2;
try{for(;n<=50;n++){const r=await fetch('q'+n+'.csv?t='+Date.now(),{cache:'no-store'});if(!r.ok)break;got[n]=await r.text()}}
catch(e){AUTOMSG='オフラインのため、前回読み込んだ問題を使っています';return}
LS.set('gk_auto',got);rebuild();
AUTOMSG=Object.keys(got).length?`自動読み込み：q2〜q${n-1}.csv（${CNT.auto}問）`:'自動読み込み：追加のCSVはまだありません';
if($('#home').classList.contains('on'))renderHome();
if($('#set').classList.contains('on'))renderSet();
}
 
/* ---------- 出題 ---------- */
let S=null,timer=null,wake=null,gen=0,JV=null,paused=false;
function chAcc(){const a={};for(let c=1;c<=7;c++)a[c]={a:0,c:0};ALL.forEach(q=>{const s=ST.q[q.id];if(s){a[q.ch].a+=s.a;a[q.ch].c+=s.c}});return a}
function poolFor(mode){
if(mode=='rev')return ALL.filter(q=>ST.q[q.id]&&ST.q[q.id].w);
return ALL.filter(q=>SET.ch.includes(q.ch)&&SET.lv.includes(q.lv)&&!(mode=='run'&&q.calc));
}
function remember(q){S.recent.push(q.id);if(S.recent.length>Math.min(20,Math.floor(S.pool.length/2)))S.recent.shift();return q}
function pick(){
let p=S.pool.filter(q=>!S.recent.includes(q.id));if(!p.length)p=S.pool;if(!p.length)return null;
const acc=chAcc();
const w=p.map(q=>{const s=ST.q[q.id],A=acc[q.ch],r=A.a?A.c/A.a:.5;return 1+(1-r)*2+(s?0:1)+(s&&s.w?2:0)});
let x=Math.random()*w.reduce((a,b)=>a+b,0);
for(let i=0;i<p.length;i++){x-=w[i];if(x<=0)return remember(p[i])}
return remember(p[p.length-1]);
}
function record(q,ok){
const s=ST.q[q.id]||(ST.q[q.id]={a:0,c:0,s:0,w:0});
s.a++;if(ok){s.c++;s.s++;if(s.w&&s.s>=2)s.w=0}else{s.s=0;s.w=1}
const d=today();ST.days[d]=(ST.days[d]||0)+1;saveST();
ok?S.ok++:S.ng++;
}
const left=()=>SET.min*60000-(((paused&&S.pz)?S.pz:Date.now())-S.t0);
const fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tick(){if(!S)return;const t='残り '+fmt(left());$('#qtime').textContent=t;$('#rtime').textContent=t}
async function lock(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(S&&document.visibilityState=='visible')lock()});
const info=()=>(S.mode=='rev'?'復習 ':'')+'第'+S.n+'問　⭕'+S.ok+' ❌'+S.ng;
 
function start(mode){
const pool=poolFor(mode);
if(!pool.length){alert(mode=='rev'?'復習する問題はまだありません。先にバイク／ランモードで解いてください。':'出題できる問題がありません。設定で分野・難易度を確認してください。');return}
if(mode=='run'&&!('speechSynthesis' in window)){alert('この端末は読み上げに対応していません');return}
S={mode,pool,t0:Date.now(),pz:0,n:0,ok:0,ng:0,heard:0,recent:[],cur:null};paused=false;
lock();clearInterval(timer);timer=setInterval(tick,1000);tick();
if(mode=='run'){speechSynthesis.cancel();$('#rpause').textContent='⏸ 一時停止';go('run');runQ()}
else{go('quiz');showQ()}
}
 
/* ---------- バイク／復習モード ---------- */
function showQ(){
if(S.n>0&&left()<=0)return finish();
if(S.mode=='rev')S.pool=poolFor('rev');
const q=pick();if(!q)return finish();
S.n++;const opts=shuf([q.a,...q.w]);S.cur={q,opts,ans:false};
$('#qinfo').textContent=info();
$('#qtag').textContent=`${q.ch}. ${CH[q.ch]}　${stars(q.lv)}${q.calc?'　🧮計算':''}`;
$('#qtext').textContent=q.q;
$('#opts').innerHTML=opts.map((o,i)=>`<button class="opt" onclick="answer(${i})"><span class="no">${i+1}</span><span>${esc(o)}</span></button>`).join('');
$('#fb').style.display='none';$('#next').style.display='none';scrollTo(0,0);
}
function answer(i){
const c=S.cur;if(c.ans)return;c.ans=true;
const k=c.opts.indexOf(c.q.a),ok=i===k;record(c.q,ok);
[...$('#opts').children].forEach((b,j)=>b.classList.add(j===k?'good':j===i?'bad':'dim'));
$('#res').className=ok?'okc':'ngc';$('#res').textContent=ok?'⭕ 正解！':'❌ 不正解（正解は '+(k+1)+'）';
$('#ex').textContent=c.q.ex;$('#fb').style.display='block';$('#next').style.display='block';
$('#qinfo').textContent=info();
$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
 
/* ---------- ランモード（読み上げ） ---------- */
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));JV=v.find(v=>/Kyoko|O-ren|Google/.test(v.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,g){
  return new Promise(res=>{
    const parts=text.replace(/([。？！?])/g,'$1\n').split('\n').map(s=>s.trim()).filter(s=>s.replace(/[。？！?、\s]/g,''));
    let i=0;
    const nx=()=>{
      if(g!==undefined&&g!==gen)return res(false);
      if(i>=parts.length)return res(true);
      const u=new SpeechSynthesisUtterance(parts[i++]);u.lang='ja-JP';if(JV)u.voice=JV;u.rate=SET.rate;
      let d=false;const fin=()=>{if(d)return;d=true;clearTimeout(t);nx()};
      const t=setTimeout(fin,(u.text.length*0.35/SET.rate+5)*1000);
      u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)};
    nx()})}
function unlockSpeak(t){if(!('speechSynthesis' in window)){alert('この端末は読み上げに対応していません');return}speechSynthesis.cancel();say(t)}
async function runQ(again){
  const g=++gen;let q;
  if(again&&S.cur)q=S.cur.q;
  else{if(S.n>0&&left()<=0)return finish();q=pick();if(!q)return finish();S.n++;S.cur={q,opts:shuf([q.a,...q.w]),graded:false,heard:false}}
  const c=S.cur,k=c.opts.indexOf(q.a),rg=$('#rgrade');
  $('#rinfo').textContent=info();
  $('#rtag').textContent=`${q.ch}. ${CH[q.ch]}　${stars(q.lv)}`;
  $('#rq').textContent=q.q;
  $('#ropts').innerHTML=c.opts.map((o,i)=>`<div class="ro">${i+1}. ${esc(o)}</div>`).join('');
  $('#rans').textContent='';rg.className='';$('#rst').textContent='🔊 問題';
  if(!await say(`第${S.n}問。${q.q}。`+c.opts.map((o,i)=>`${i+1}番、${o}。`).join(''),g))return;
  for(let s=SET.think;s>0;s--){if(g!==gen)return;$('#rst').textContent='🤔 考え中… '+s;await sleep(1000)}
  if(g!==gen)return;
  $('#ropts').children[k].classList.add('good');$('#rans').textContent='💡 '+q.ex;
  rg.className='on'+(c.graded?' done':'');$('#rst').textContent='✅ 正解は '+(k+1)+'番';
  if(!c.heard){c.heard=true;S.heard++}
  if(!await say(`正解は、${k+1}番、${q.a}。${q.ex}`,g))return;
  $('#rst').textContent='⏭ 次の問題へ';await sleep(3000);
  if(g!==gen)return;runQ();
}
function grade(ok){const c=S&&S.cur;if(!c||c.graded)return;c.graded=true;record(c.q,!!ok);$('#rgrade').classList.add('done');$('#rinfo').textContent=info()}
function togglePause(){
  if(!S)return;paused=!paused;
  if(paused){S.pz=Date.now();gen++;speechSynthesis.cancel();$('#rst').textContent='⏸ 一時停止中';$('#rpause').textContent='▶ 再開'}
  else{S.t0+=Date.now()-S.pz;S.pz=0;$('#rpause').textContent='⏸ 一時停止';runQ(true)}
}

/* ---------- 終了 ---------- */
function finish(){
  if(!S)return go('home');
  gen++;try{speechSynthesis.cancel()}catch(e){}
  clearInterval(timer);if(wake){wake.release().catch(()=>{});wake=null}
  const m=Math.max(1,Math.round((Date.now()-S.t0)/60000)),rec=S.ok+S.ng,rate=rec?Math.round(S.ok/rec*100):0;
  $('#dsum').innerHTML=`<div class="big2">${rate}<small>%</small></div>
  <p>${S.mode=='run'?'聞いた問題 '+S.heard+'問／記録 '+rec+'問':'解いた問題 '+rec+'問'}</p>
  <p>⭕ ${S.ok}　❌ ${S.ng}　⏱ 約${m}分</p><p>復習待ち：${poolFor('rev').length}問</p>`;
  S=null;paused=false;go('done');
}

/* ---------- 画面 ---------- */
function renderHome(){
  const d=Math.ceil((EXAM-Date.now())/86400000);
  $('#cd').textContent=d>0?`📅 G検定 2027/1/16 まであと ${d} 日`:'📅 試験日を過ぎました';
  let a=0,c=0,n=0;Object.values(ST.q).forEach(s=>{a+=s.a;c+=s.c;n++});
  $('#hsum').textContent=`全${ALL.length}問　解いた問題 ${n}　正答率 ${a?Math.round(c/a*100):0}%　今日 ${ST.days[today()]||0}問`;
  $('#mins').innerHTML=[10,15,20,30,45,60].map(m=>`<button class="chip${SET.min==m?' sel':''}" onclick="SET.min=${m};saveSET();renderHome()">${m}分</button>`).join('');
  $('#revn').textContent='間違えた問題 '+poolFor('rev').length+'問';
}
function renderStats(){
  const acc=chAcc();let h='';
  for(let c=1;c<=7;c++){
    const qs=ALL.filter(q=>q.ch==c),done=qs.filter(q=>ST.q[q.id]).length,A=acc[c],r=A.a?Math.round(A.c/A.a*100):0;
    const col=!A.a?'#444':r<60?'#e33':r<80?'#fc3':'#0c6';
    h+=`<div class="st"><div class="stn">${c}. ${CH[c]}</div><div class="sbar"><i style="width:${A.a?r:0}%;background:${col}"></i></div>
    <div class="sts">正答率 ${A.a?r+'%':'—'}　解いた ${done}/${qs.length}問　回答 ${A.a}回</div></div>`}
  const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000),k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();days.push(`${d.getMonth()+1}/${d.getDate()}：${ST.days[k]||0}問`)}
  h+=`<h2>直近7日</h2><div class="sts">${days.join('<br>')}</div>
  <div class="tip">合格ラインは公表されていません。全分野で正答率80%以上を目標にしましょう。正答率の低い分野は自動で多めに出題されます。</div>`;
  $('#stbody').innerHTML=h;
}
const chip=(on,label,fn,w)=>`<button class="chip${w?' w':''}${on?' sel':''}" onclick="${fn}">${label}</button>`;
function renderSet(){
  $('#chs').innerHTML=CH.slice(1).map((n,i)=>{const on=SET.ch.includes(i+1);return chip(on,`${on?'☑':'☐'} ${i+1}. ${n}（${ALL.filter(q=>q.ch==i+1).length}問）`,`tog('ch',${i+1})`,1)}).join('');
  $('#lvs').innerHTML=[[1,'★ 基礎'],[2,'★★ 標準'],[3,'★★★ 応用']].map(([v,l])=>chip(SET.lv.includes(v),l,`tog('lv',${v})`)).join('');
  $('#rates').innerHTML=[1,1.25,1.5,1.75,2,2.5].map(v=>chip(SET.rate==v,v+'倍',`SET.rate=${v};saveSET();renderSet()`)).join('');
  $('#thinks').innerHTML=[3,5,8,12].map(v=>chip(SET.think==v,v+'秒',`SET.think=${v};saveSET();renderSet()`)).join('');
  $('#xinfo').innerHTML=`内蔵 ${CNT.base}問／自動読み込み ${CNT.auto}問／手動追加 ${CNT.extra}問<br>${esc(AUTOMSG||'自動読み込み：確認中…')}`;
}
function tog(k,v){const a=SET[k],i=a.indexOf(v);if(i>=0){if(a.length==1){alert('1つ以上選んでください');return}a.splice(i,1)}else a.push(v);saveSET();renderSet()}
function exportCSV(){
  const f=s=>{s=String(s??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[['分野','難易度','問題','正解','誤答1','誤答2','誤答3','解説','計算'],...ALL.map(q=>[q.ch,q.lv,q.q,q.a,...q.w,q.ex,q.calc?1:0])];
  const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(f).join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gkentei_questions.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$('#csvin').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{const have=new Set(ALL.map(q=>q.id)),ex=LS.get('gk_extra',[]);let n=0;
    csvQs(r.result,'extra').forEach(q=>{if(!have.has(q.id)){have.add(q.id);ex.push(q);n++}});
    LS.set('gk_extra',ex);rebuild();renderSet();
    alert(n+'問を追加しました'+(n?'':'（形式が違うか、すでに登録済みの問題です）'));e.target.value=''};
  r.readAsText(file,'UTF-8')});
function clearExtra(){if(confirm('手動で追加した問題を削除しますか？（自動読み込みの問題は残ります）')){LS.set('gk_extra',[]);rebuild();renderSet()}}
function resetStat(){if(confirm('成績をすべてリセットしますか？')){ST={q:{},days:{}};saveST();renderSet()}}
function spd(d){SET.rate=Math.round(Math.min(3,Math.max(0.5,SET.rate+d))*100)/100;saveSET();$('#rspd').textContent='🔊 '+SET.rate+'倍'}
function go(id){
document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));
if(id=='home')renderHome();if(id=='stats')renderStats();if(id=='set')renderSet();if(id=='run')spd(0);scrollTo(0,0);
}

rebuild();go('home');autoLoad();
</script>
</body>
</html>
